<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>IDEV Creative Coders | Creative Technology & Software Development</title>
    <meta name="description" content="IDEV Creative Coders builds modern websites, software applications, AI solutions, cloud platforms, and digital experiences for ambitious businesses." />
    <meta name="keywords" content="software development, web development, AI development, mobile application development, cloud solutions, UI UX design, software company, technology company, creative development, IDEV Creative Coders" />
    <meta name="author" content="IDEV Creative Coders" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IDEV Creative Coders | Creative Technology & Software Development" />
    <meta property="og:description" content="IDEV Creative Coders builds modern websites, software applications, AI solutions, cloud platforms, and digital experiences for ambitious businesses." />
    <meta property="og:url" content="https://idevpro.in/" />
    <meta property="og:site_name" content="IDEV Creative Coders" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IDEV Creative Coders | Creative Technology & Software Development" />
    <meta name="twitter:description" content="IDEV Creative Coders builds modern websites, software applications, AI solutions, cloud platforms, and digital experiences for ambitious businesses." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts - Bricolage Grotesque (display), DM Sans (body), Space Mono (technical metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Blocking script to prevent flash of wrong theme on refresh -->
    <script>
      (function() {
        const theme = localStorage.getItem("theme") || "system";
        const isLight = theme === "light" || (theme === "system" && !window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isLight) {
          document.documentElement.classList.add("light");
        } else {
          document.documentElement.classList.remove("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
